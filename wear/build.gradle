plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
// Explicit cloud validation produces unsigned files; signing remains local.
def unsignedValidation = providers.gradleProperty('courtStoryUnsignedValidation').getOrElse('false').toBoolean()
def releaseSigning = new Properties()
def releaseSigningFile = System.getenv('COURT_STORY_SIGNING_PROPERTIES')
if (releaseSigningFile != null) {
    file(releaseSigningFile).withInputStream { releaseSigning.load(it) }
}
android {
    namespace 'com.courtstory.app'
    compileSdk 36
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    defaultConfig {
        applicationId 'com.courtstory.app'
        minSdk 30
        targetSdk 36
        versionCode 100013
        versionName providers.gradleProperty('courtStoryVersion').getOrElse('1.0-test.13')
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    kotlinOptions { jvmTarget = '17' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (!releaseSigning.isEmpty()) {
                storeFile file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'); signingConfig unsignedValidation ? null : signingConfigs.release }; qa { initWith debug; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'); testProguardFiles '../test-rules.pro'; applicationIdSuffix '.qa'; resValue 'string', 'app_name', 'Court Story Test Data'; matchingFallbacks = ['debug'] } }; testBuildType 'qa'
    sourceSets { main { java.srcDirs += ['../app/src/main/java']; res.srcDirs += ['../app/src/main/res']; assets.srcDirs += ['../app/src/main/assets'] } }
    lint { abortOnError true }

}
dependencies { implementation 'androidx.wear.protolayout:protolayout-expression:1.4.2'; implementation 'androidx.wear.protolayout:protolayout-proto:1.4.2'; implementation 'androidx.wear.protolayout:protolayout-external-protobuf:1.4.2'; implementation 'androidx.fragment:fragment:1.8.9'; implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.3.0'; implementation 'com.google.guava:guava:31.0.1-android'; implementation 'com.google.android.gms:play-services-wearable:20.0.1'; implementation 'androidx.health:health-services-client:1.1.0'; implementation 'androidx.activity:activity-ktx:1.9.3'; implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'; implementation 'androidx.health.connect:connect-client:1.1.0'; androidTestImplementation 'com.google.android.apps.common.testing.accessibility.framework:accessibility-test-framework:4.1.1'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }




tasks.configureEach { task ->
    if (task.name in ['validateSigningRelease', 'packageReleaseBundle', 'packageRelease']) {
        task.doFirst {
            if (!unsignedValidation && releaseSigning.isEmpty()) throw new GradleException('Configure COURT_STORY_SIGNING_PROPERTIES with your private upload-key properties before making a release.')
        }
    }
}
